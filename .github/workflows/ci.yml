name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチへ続けて push したら古い実行は打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: テスト (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # グリッド表の記法は pandoc の解釈に強く依存するため、
      # src/formats/pandoc.test.ts を本物の pandoc に対して実行する。
      - name: pandoc を入れる (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: pandoc の版を確認
        if: runner.os == 'Linux'
        run: pandoc --version

      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      # Linux では pandoc を入れたので、スキップされたら失敗させる
      # （検査が黙って素通りするのを防ぐ）
      - name: ユニットテスト
        run: npm test
        env:
          REQUIRE_PANDOC: ${{ runner.os == 'Linux' && '1' || '' }}

      - name: ビルド
        run: npm run build

      - name: オフライン検査（実行時に通信しないこと）
        run: npm run check:offline

  audit:
    name: 脆弱性チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # 利用者へ配布されるのは本番依存だけなので、ここは必ず 0 件であること
      - name: 本番依存の脆弱性（0 件必須）
        run: npm run check:audit

      # 開発用の依存は情報として出すだけで、CI は落とさない
      - name: 開発依存の脆弱性（参考）
        run: npm audit || true

  package:
    name: VSIX の生成
    runs-on: ubuntu-latest
    needs: [test, audit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: パッケージ
        run: npm run package
      - name: 成果物を保存
        uses: actions/upload-artifact@v5
        with:
          name: quarto-table-support-vsix
          path: '*.vsix'
          if-no-files-found: error
